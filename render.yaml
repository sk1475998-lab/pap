services:
  - type: web
    name: superjob-cloud-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run start --workspace @superjob/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
